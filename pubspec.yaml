name: serverdeck
description: "Manage your Linux servers from your phone over SSH."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^4.1.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#151B23"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: "#151B23"
  image: assets/icon/splash.png
  android_12:
    color: "#151B23"
    image: assets/icon/splash.png
  ios: true
  android: true
